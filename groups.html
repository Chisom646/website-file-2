<!DOCTYPE html>
<html>
<head>
  <title>Groups</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">

    <h1> Groups / Chart</h1>
    <nav>
      <h2>People Help The People</h2>
      <div>
        <a href="landing.html">Signout</a>
        <a href="dashboard.html">Home</a>
        <a href="groups.html">Groups</a>
        <a href="profile.html">Profile</a>
      </div>
    </nav>

    <div class="grid-2" style="margin-top:20px; grid-template-columns:1fr 2fr;">

      <!-- Groups -->
      <div class="card">
        <h3>Featured Groups</h3>
        <br>

        <div class="flex" style="margin-bottom:15px;">
          <div class="profile-pic" style="width:45px; height:45px; margin:0;"></div>
          <p style="margin-left:10px;">Mindful Moments</p>
        </div>

        <div class="flex" style="margin-bottom:15px;">
          <div class="profile-pic" style="width:45px; height:45px; margin:0;"></div>
          <p style="margin-left:10px;">Healing Together</p>
        </div>

        <div class="flex">
          <div class="profile-pic" style="width:45px; height:45px; margin:0;"></div>
          <p style="margin-left:10px;">Calm Circle</p>
        </div>

      </div>

      <!-- Posts -->
      <div class="card">
        <h3>Community Posts</h3>

        <div class="card" style="background:#f6f9ff; margin-top:10px;">
          <b>User 1</b>
          <p>Sending light and support to everyone today.</p>
        </div>

        <div class="card" style="background:#f6fffb; margin-top:10px;">
          <b>User 2</b>
          <p>Grateful for this community.</p>
        </div>

      </div>

    </div>
  </div>
  <script src="auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Check authentication for protected pages
    const currentPage = window.location.pathname;
    const protectedPages = ['dashboard.html', 'profile.html', 'groups.html'];
    
    if (protectedPages.some(page => currentPage.includes(page))) {
      if (!AuthService.isAuthenticated()) {
        window.location.href = 'login.html';
      }
    }
    
    // Update navigation if logged in
    const navLinks = document.querySelector('nav div');
    if (AuthService.isAuthenticated() && navLinks) {
      const userData = AuthService.getUserData();
      const username = userData?.username || 'User';
      
      const userSpan = document.createElement('span');
      userSpan.style.marginRight = '15px';
      userSpan.style.fontWeight = 'bold';
      userSpan.textContent = `Hi, ${username}`;
      navLinks.insertBefore(userSpan, navLinks.firstChild);
      
      // Update logout link
      const logoutLink = navLinks.querySelector('a[href="landing.html"]');
      if (logoutLink) {
        logoutLink.href = '#';
        logoutLink.onclick = function(e) {
          e.preventDefault();
          if (confirm('Are you sure you want to logout?')) {
            AuthService.logout();
            window.location.href = 'landing.html';
          }
        };
      }
    }
  });
  
  function logout() {
    if (confirm('Are you sure you want to logout?')) {
      AuthService.logout();
      window.location.href = 'landing.html';
    }
  }
</script>
</body>
</html>
