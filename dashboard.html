<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .post-form {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .post-form textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
    }

    .post-form textarea:focus {
      outline: none;
      border-color: #b8dcff;
      box-shadow: 0 0 0 3px rgba(184, 220, 255, 0.2);
    }

    .post-form-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      align-items: center;
    }

    .post-form select {
      padding: 10px 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      background: white;
      cursor: pointer;
    }

    .post-form select:focus {
      outline: none;
      border-color: #b8dcff;
      box-shadow: 0 0 0 3px rgba(184, 220, 255, 0.2);
    }
  </style>
</head>

<body>
  <div class="container">
    <nav class="card">
      <h2>People Help The People</h2>
      <div>
        <a href="dashboard.html">Home</a>
        <a href="communities.html">Communities</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </nav>

    <div class="grid-2 mt-20" style="grid-template-columns:1fr 2fr;">

      <!-- Welcome Card -->
      <div class="card" id="welcomeCard">
        <h3>Welcome!</h3>
        <p>Loading your information...</p>
      </div>

      <!-- Feed -->
      <div>
        <div class="card">
          <h3>Share Your Thoughts</h3>
          <div class="post-form">
            <textarea
              id="post-content"
              placeholder="What's on your mind? Share your thoughts, experiences, or words of encouragement..."
              maxlength="2000"
            ></textarea>
            <div class="post-form-actions">
              <select id="post-community">
                <option value="">General Feed</option>
                <!-- Communities loaded dynamically -->
              </select>
              <button id="post-submit" class="btn btn-green">Post</button>
            </div>
          </div>
        </div>

        <div class="card mt-20">
          <h3>Community Feed</h3>
          <div id="feed-posts">
            <!-- Posts will be loaded here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/auth-guard.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/feed.js"></script>

  <script>
    async function loadDashboard() {
      if (!Auth.isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const result = await API.getProfile();

        if (result.success) {
          const user = result.data;
          const welcomeCard = document.getElementById('welcomeCard');

          welcomeCard.innerHTML = `
            <h3>Welcome, ${UI.escapeHtml(user.name || user.username)}!</h3>
            <p><strong>Email:</strong> ${UI.escapeHtml(user.email)}</p>
            ${user.roles ? `<p><strong>Role:</strong> ${UI.escapeHtml(user.roles.join(', '))}</p>` : ''}
            <p style="margin-top: 15px; font-style: italic; color: #666;">
              "You are not alone. We're here to support each other."
            </p>
            <div style="margin-top: 20px;">
              <a href="communities.html" class="btn btn-blue" style="text-decoration: none;">
                💬 Join Communities
              </a>
            </div>
          `;
        } else {
          if (result.error === 'Not authenticated' || result.status === 401) {
            Auth.logout();
            window.location.href = 'login.html';
          } else {
            UI.showError('welcomeCard', result.error || 'Failed to load profile');
          }
        }
      } catch (error) {
        console.error('Error loading dashboard:', error);
        UI.showError('welcomeCard', 'Failed to load dashboard. Please try again.');
      }
    }

    function logout() {
      if (UI.confirm('Are you sure you want to logout?')) {
        Auth.logout();
        window.location.href = 'landing.html';
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
