<!DOCTYPE html>
<html>
<head>
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <nav class="card">
      <h2>People Help The People</h2>
      <div>
        <a href="dashboard.html">Home</a>
        <a href="communities.html">Communities</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </nav>

    <div class="card" style="max-width:500px; margin:auto;">
      <div class="profile-pic" id="profileImage"></div>

      <h2 style="text-align:center; margin-top:10px;" id="userName">Loading...</h2>

      <div style="margin-top:20px; line-height:1.8;" id="profileInfo">
        <p>Loading profile information...</p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/auth-guard.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>

  <script>
    async function loadProfile() {
      if (!Auth.isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }

      const profileInfo = document.getElementById('profileInfo');
      UI.showLoading(profileInfo, 'Loading profile...');

      try {
        const result = await API.getProfile();

        if (result.success) {
          const user = result.data;

          // Update profile image with initials
          const profileImage = document.getElementById('profileImage');
          const initials = (user.name || user.username).charAt(0).toUpperCase();
          profileImage.textContent = initials;

          // Update user name
          document.getElementById('userName').textContent = user.name || user.username;

          // Calculate age from birth date
          let ageInfo = '';
          if (user.birth) {
            const birthDate = new Date(user.birth);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
              age--;
            }
            ageInfo = `<p><b>Age:</b> ${age}</p>`;
          }

          // Update profile information (using safe HTML)
          const safeGender = UI.escapeHtml(user.sex || 'Not specified');
          const safeEmail = UI.escapeHtml(user.email);
          const safePhone = user.phone_number ? UI.escapeHtml(user.phone_number) : null;
          const memberSince = new Date(user.created_at).toLocaleDateString();

          profileInfo.innerHTML = `
            ${ageInfo}
            <p><b>Gender:</b> ${safeGender}</p>
            <p><b>Email:</b> ${safeEmail}</p>
            ${safePhone ? `<p><b>Phone:</b> ${safePhone}</p>` : ''}
            <p><b>Member since:</b> ${memberSince}</p>
            <p style="margin-top: 20px; font-style: italic; border-top: 1px solid #eee; padding-top: 15px; color: #666;">
              "Strength doesn't come from what you can do. It comes from overcoming the things you once thought you couldn't."
            </p>
          `;

        } else {
          if (result.error === 'Not authenticated' || result.status === 401) {
            Auth.logout();
            window.location.href = 'login.html';
          } else {
            UI.showError(profileInfo, result.error || 'Failed to load profile');
          }
        }
      } catch (error) {
        console.error('Error loading profile:', error);
        UI.showError(profileInfo, 'Failed to load profile. Please try again.');
      }
    }

    function logout() {
      if (UI.confirm('Are you sure you want to logout?')) {
        Auth.logout();
        window.location.href = 'landing.html';
      }
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
