<!DOCTYPE html>
<html>
<head>
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js"></script>
</head>

<body>
  <div class="container">
    <nav>
      <h2>People Help The People</h2>
      <div>
        <a href="#" onclick="logout()">Signout</a>
        <a href="dashboard.html">Home</a>
        <a href="groups.html">Groups</a>
        <a href="profile.html">Profile</a>
      </div>
    </nav>

    <div class="card" style="max-width:500px; margin:auto;">
      <div class="profile-pic" id="profileImage"></div>

      <h2 style="text-align:center; margin-top:10px;" id="userName">Loading...</h2>

      <div style="margin-top:20px; line-height:1.8;" id="profileInfo">
        <p>Loading profile information...</p>
      </div>
    </div>
  </div>

  <script>
    async function loadProfile() {
      // Check authentication
      if (!AuthService.isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }
      
      try {
        // Load user profile
        const result = await ApiService.getProfile();
        
        if (result.success) {
          const user = result.data;
          
          // Update profile image with initials
          const profileImage = document.getElementById('profileImage');
          const initials = (user.name || user.username).charAt(0).toUpperCase();
          profileImage.innerHTML = `<span style="font-size: 48px; line-height: 110px;">${initials}</span>`;
          profileImage.style.background = '#4a6fa5';
          profileImage.style.color = 'white';
          profileImage.style.display = 'flex';
          profileImage.style.alignItems = 'center';
          profileImage.style.justifyContent = 'center';
          
          // Update user name
          document.getElementById('userName').textContent = user.name || user.username;
          
          // Calculate age from birth date
          let ageInfo = '';
          if (user.birth) {
            const birthDate = new Date(user.birth);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
              age--;
            }
            ageInfo = `<p><b>Age:</b> ${age}</p>`;
          }
          
          // Update profile information
          document.getElementById('profileInfo').innerHTML = `
            ${ageInfo}
            <p><b>Gender:</b> ${user.sex || 'Not specified'}</p>
            <p><b>Email:</b> ${user.email}</p>
            ${user.phone_number ? `<p><b>Phone:</b> ${user.phone_number}</p>` : ''}
            <p><b>Member since:</b> ${new Date(user.created_at).toLocaleDateString()}</p>
            <p style="margin-top: 20px; font-style: italic; border-top: 1px solid #eee; padding-top: 15px;">
              "Strength doesn't come from what you can do. It comes from overcoming the things you once thought you couldn't."
            </p>
          `;
          
        } else {
          if (result.error === 'Not authenticated') {
            AuthService.logout();
            window.location.href = 'login.html';
          } else {
            document.getElementById('profileInfo').innerHTML = `
              <p style="color: red;">Error: ${result.error}</p>
            `;
          }
        }
      } catch (error) {
        console.error('Error loading profile:', error);
        document.getElementById('profileInfo').innerHTML = `
          <p style="color: red;">Failed to load profile. Please try again.</p>
        `;
      }
    }
    
    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        AuthService.logout();
        window.location.href = 'landing.html';
      }
    }
    
    // Load profile when page loads
    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
